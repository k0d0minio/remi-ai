name: Quality

# The ONE quality job this repo runs in CI — the estate's cost floor (icm-board decision D43,
# `.icm/_shared/ci.md` → What CI is for). The repo is public, so the minutes are free; the shape
# is the estate's so nothing changes if that ever does:
#
#   • ADVISORY, by name. The job is `Quality (advisory)`: `ci-status.sh` reports it and never
#     reds on it, and the ruleset on `main` requires the deploy statuses, not this. The merge
#     waits on the deploy — Vercel already built the head, which is why there is no build step.
#   • READY HEADS ONLY. A draft owes CI nothing: `format.sh` / `lint.sh` / `security-check.sh`
#     over the changed files are the session's pre-flip check. The `types:` list REPLACES
#     GitHub's default — `ready_for_review` is named so the flip itself runs it, and the
#     job-level `if:` keeps a draft's `synchronize` free.
#   • NEVER ON `main`. The merge commit's proof is Vercel's build of `main`. No `push:` trigger.
#   • PATH-FILTERED. Nothing waits on this job, so it skips `.icm/**`, markdown and `.github/**`.
#   • ONE JOB, cheapest first: the migration-order check, then format · lint · typecheck · the
#     @remi/services vitest suite.
#   • SUPERSEDED RUNS ARE CANCELLED. One run per branch; a newer push replaces the one in flight.
#
# A red run here is a finding the stage fixes on the branch — advisory means the merge never
# waits on it, not that it may be ignored.

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
    paths-ignore:
      - ".icm/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Quality (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Migration order
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node packages/services/scripts/check-migration-order.mjs --base FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

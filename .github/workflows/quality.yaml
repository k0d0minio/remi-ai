name: Quality

on:
  pull_request:
    # Markdown-only and pipeline-doc commits can't affect format/lint/types. Skip the
    # full install and checks when nothing else changed — the pipeline workflow handles
    # those paths, and it is far cheaper.
    paths-ignore:
      - "pipeline/**"
      - "**/*.md"
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same PR, but never cancel a main build: head_ref is only
# set for pull_request events, so pushes fall back to the unique run_id and each gets its
# own concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Share the Turborepo remote cache with Vercel. `typecheck` dependsOn ["^build"], so the
# @remi/ui and @remi/services builds it needs are restored from the shared cache instead of
# recompiled here. TURBO_TOKEN is a secret (absent on forked-PR runs — the cache then
# silently no-ops as a miss, never a failure); TURBO_TEAM is a non-secret repo variable.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Format, lint, typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its `cache: pnpm` can resolve the store path.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # The repo starts clean, so the ceiling starts at zero and stays there. If a rule
      # is ever relaxed to a warning during a migration, raise this to the exact current
      # count and lower it as they are cleared — never raise it to make one PR pass.
      - name: Lint
        run: pnpm lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      # Only @remi/services defines a `test` task today — REMI-001 brought the
      # minimum Vitest setup with it so the auth layer could not ship untested.
      # REMI-008 widens this to every workspace and adds the src/db/** coverage
      # floor; until then turbo simply finds nothing to run elsewhere.
      - name: Test
        run: pnpm test

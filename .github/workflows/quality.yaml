name: Quality

# No path filter, deliberately. A check that some PRs never produce cannot be a required
# check: branch protection would either deadlock those PRs or let a red run block nothing.
# Every PR runs this, and doc-only diffs stay cheap on their own merits — `format:check`
# covers markdown anyway, and lint/typecheck restore from the shared Turborepo cache
# instead of recomputing. Never reintroduce a skip here (audit F-22).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same PR, but never cancel a main build: head_ref is only
# set for pull_request events, so pushes fall back to the unique run_id and each gets its
# own concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Share the Turborepo remote cache with Vercel. `typecheck` dependsOn ["^build"], so the
# @remi/ui and @remi/services builds it needs are restored from the shared cache instead of
# recompiled here. TURBO_TOKEN is a secret (absent on forked-PR runs — the cache then
# silently no-ops as a miss, never a failure); TURBO_TEAM is a non-secret repo variable.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Format, lint, typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its `cache: pnpm` can resolve the store path.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # The repo starts clean, so the ceiling starts at zero and stays there. If a rule
      # is ever relaxed to a warning during a migration, raise this to the exact current
      # count and lower it as they are cleared — never raise it to make one PR pass.
      - name: Lint
        run: pnpm lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      # The service-layer suite (vitest, in @remi/services). No database and no
      # network: the db services run against an in-memory client at the seam.
      - name: Test
        run: pnpm test

name: Pipeline

# Offloads two deterministic pipeline chores from the agent's context onto CI:
#   1. labels     — project a run's labels (type/app/complexity + the stage:* it is now at) from
#                   spec.md and which run outputs exist, so no stage has to advance stage:* by hand.
#                   Pushing a stage's output is what moves the board.
#
#                   The spine is four stages (Scope -> Define -> Build -> Release), so the outputs
#                   live at 02_define/ . 03_build/ . 04_release/. The runs archived under
#                   .icm/runs/ were written by the six-stage pipeline and still carry the old
#                   layout (03_define/ . 04_build/ . 05_verify/ . 06_ship/); both are matched here
#                   and in project-labels.sh, which maps verify and ship onto stage:release.
#                   Nothing new writes the legacy paths.
#   2. spec-check — a NON-BLOCKING structural backstop on spec.md. Define still runs
#                   validate-spec.sh before its gate (that is the real check); this only flags drift
#                   on later pushes via the job summary, and never red-blocks the PR.
#
# Runs only for same-repo PRs — a forked PR gets a read-only token that cannot write labels.
# Quality runs on every PR, this one only on runs that touch .icm/runs/** — the two are
# independent, and this one stays cheap because it installs nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".icm/runs/**"

concurrency:
  group: pipeline-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write # the labels REST API writes to the PR as an issue

jobs:
  labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Project run labels
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit to diff which runs changed

      - name: Project labels for each changed run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # The optional `_done/` segment is Release's close-out: it moves the run folder into the
          # archive on the branch, so the final push of a run reports it under both paths. Both
          # normalise to the same slug, and sort -u collapses them.
          slugs="$(git diff --name-only "$BASE_SHA" HEAD \
            | sed -nE 's#^\.icm/runs/(_done/)?([^/]+)/.*#\2#p' | sort -u || true)"
          if [ -z "$slugs" ]; then echo "No changed runs — nothing to label."; exit 0; fi
          for slug in $slugs; do
            run_dir=".icm/runs/$slug"
            [ -d "$run_dir" ] || run_dir=".icm/runs/_done/$slug"
            # Only ever project a run's labels onto its OWN PR. A PR can touch runs that are not
            # its own — a migration or a sweep moving archived folders — and stamping their
            # type/complexity/app set onto this PR would misdescribe it. A run.md with no `- pr:`
            # line yet is this PR's own run mid-scaffold (new-run.sh commits the run before it
            # opens the PR), so it passes.
            run_pr="$(grep -m1 '^- pr:' "$run_dir/run.md" 2>/dev/null \
              | sed -E 's/^- pr:[[:space:]]*//; s/[[:space:]]+#.*$//; s#^.*/pull/##; s/^#//; s/[^0-9].*$//' || true)"
            if [ -n "$run_pr" ] && [ "$run_pr" != "$PR_NUMBER" ]; then
              echo "::notice::run '$slug' changed but belongs to PR #$run_pr — not this one; skipping labels"
              continue
            fi
            spec="$run_dir/02_define/output/spec.md"
            # Legacy six-stage layout — the archived runs.
            [ -f "$spec" ] || spec="$run_dir/03_define/output/spec.md"
            if [ ! -f "$spec" ]; then
              echo "::notice::run '$slug' changed but has no spec.md (lane run?) — skipping labels"
              continue
            fi
            echo "::group::labels for $slug"
            # One malformed spec must not red-fail the job — warn and carry on.
            .icm/scripts/project-labels.sh "$slug" --stage auto --pr "$PR_NUMBER" \
              || echo "::warning::could not project labels for '$slug' (check the spec header — see log)"
            echo "::endgroup::"
          done

  spec-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Spec structure (advisory)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed specs (advisory — never a merge gate)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          specs="$(git diff --name-only "$BASE_SHA" HEAD \
            | grep -E '^\.icm/runs/(_done/)?[^/]+/0[23]_define/output/spec\.md$' \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done | sort -u || true)"
          if [ -z "$specs" ]; then echo "No spec.md changed — nothing to validate."; exit 0; fi
          for spec in $specs; do
            echo "::group::validate $spec"
            if .icm/scripts/validate-spec.sh "$spec"; then
              echo "- ✅ \`$spec\` — structurally sound" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ \`$spec\` — structural issues (advisory, see log)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=${spec}::Spec has structural issues — advisory, not a merge gate. Fix with /pipeline define <slug>."
            fi
            echo "::endgroup::"
          done
          # Advisory by contract: this step always exits 0 so it never blocks the PR.
          exit 0

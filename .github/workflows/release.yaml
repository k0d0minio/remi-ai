# release: the merge of a pull request to main is the production release (Vercel deploys main).
# This job announces it: one GitHub Release named after the pull request, and one Slack post.
# Nothing here promotes, migrates or merges. A line `- announce: none` in the pull request
# body skips the job. The red job is the alert when a channel refuses the message.
name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write # the Release
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  announce:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !contains(github.event.pull_request.body, '- announce: none')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cut the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          tag="release/$(date -u +%F)-pr-${PR_NUMBER}"
          # The notes: the pull request's "What changes" section, else its whole body.
          notes="$(printf '%s\n' "$PR_BODY" | awk '/^## What changes/ { f = 1; next } f && /^## / { exit } f { print }')"
          [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ] || notes="$PR_BODY"
          printf '%s\n\n%s\n' "$notes" "$PR_URL" > notes.md
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "the Release $tag exists. Nothing cut twice."
          else
            gh release create "$tag" -R "$REPO" --target "$MERGE_SHA" --title "$PR_TITLE" --notes-file notes.md
          fi
          echo "url=https://github.com/${REPO}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ANNOUNCE_CHANNEL_ID: ${{ vars.SLACK_ANNOUNCE_CHANNEL_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_ANNOUNCE_CHANNEL_ID" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_ANNOUNCE_CHANNEL_ID is not set. No post."
            exit 0
          fi
          payload="$(jq -n --arg c "$SLACK_ANNOUNCE_CHANNEL_ID" --arg t ":rocket: *${PR_TITLE}*"$'\n'"${RELEASE_URL}" \
            '{channel: $c, text: $t, unfurl_links: false, unfurl_media: false}')"
          resp="$(curl -fsS -m 20 -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "$payload" https://slack.com/api/chat.postMessage)"
          [ "$(printf '%s' "$resp" | jq -r '.ok // false')" = "true" ] \
            || { echo "::error::Slack refused the post: $(printf '%s' "$resp" | jq -r '.error // "unknown"')"; exit 1; }

# ci: the client checks and the release (CI is truth; never run locally). The jobs are in this
# file since 2026-11-17 (triage/ci-without-legible-consulting). Before that date this file
# called check-client.yml and release.yml of legible-consulting/.github. The jobs are those
# workflows at commit cb3893f (2026-10-30), with the workspace branches removed: this repo
# is a build. The check names are the names of before: check / secrets, check / workflows,
# check / code, release / release-please.
#
# A private repo is billed per job, rounded up to a minute. So `secrets` runs every time and
# also reads the changed files. `workflows` and `code` run only when a changed file needs them.
# The pull request's contract and its merge gate are in gate.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: check / secrets
    # Private repos on GitHub Free get no secret scanning; this is the guard. The binary,
    # not gitleaks-action: the action needs a paid licence on organisation accounts.
    # The job has the full history already, so it reads the changed files for the other jobs.
    # A job of its own for that costs one more billed minute on every run.
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.changed.outputs.workflows }}
      code: ${{ steps.changed.outputs.code }}
      has_check_migrations: ${{ steps.changed.outputs.has_check_migrations }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: changed-files
        id: changed
        env:
          # This repo is a build, not a workspace.
          WORKSPACE: "false"
        run: |
          # A pull request: the files that differ from its base. A push: the files of the
          # last commit. No last commit: every file.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            files="$(git diff --name-only HEAD~1 HEAD)"
          else
            files="$(git ls-files)"
          fi
          workflows=false
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in .github/workflows/*) workflows=true ;; esac
            if [ "$WORKSPACE" = true ]; then
              # A workspace's code check reads the stage contracts only.
              case "$f" in CONTEXT.md | */CONTEXT.md) code=true ;; esac
            else
              case "$f" in .icm/* | *.md | .github/*) ;; *) code=true ;; esac
            fi
          done <<<"$files"
          # The repo's own check:migrations script knows its migrations folder and decides
          # what order means. This job reads no migrations_path: the blueprint dropped the
          # question (blueprint pull request 34), and an answer left behind must not silence
          # the check.
          has_check_migrations=false
          if [ "$WORKSPACE" != true ] && [ -f package.json ] &&
            grep -q '"check:migrations"' package.json; then
            has_check_migrations=true
          fi
          {
            echo "workflows=${workflows}"
            echo "code=${code}"
            echo "has_check_migrations=${has_check_migrations}"
          } >>"$GITHUB_OUTPUT"
          echo "workflows changed: ${workflows}. code to check: ${code}. check:migrations defined: ${has_check_migrations}."
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .
      - name: Environments file
        # A build has .icm/environments.md: one table whose header row has the five columns.
        # Required from blueprint v1.2.0, the first tag that renders the file. A build on an
        # older tag gets the file with its `copier update`, so no live repo goes red before it
        # has the file (2026-10-29). A repo with no .copier-answers.yml is not a blueprint
        # build, for example this repo. A workspace has no file and no check.
        # It runs also when the scan failed: each verdict stays visible.
        if: ${{ !cancelled() }}
        run: |
          f=.icm/environments.md
          a=.copier-answers.yml
          first=1.2.0
          if [ ! -f "$a" ]; then
            echo "No ${a}: not a blueprint build. No check of ${f}."
            exit 0
          fi
          if grep -qx 'workspace: true' "$a"; then
            echo "A workspace: no check of ${f}."
            exit 0
          fi
          ref="$(sed -n 's/^_commit: *//p' "$a" | tr -d "\"'")"
          v="${ref#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] &&
            [ "$(printf '%s\n' "$first" "$v" | sort -V | head -n1)" != "$first" ]; then
            echo "Rendered from ${ref}, before v${first}: no check of ${f}. Its copier update brings the file."
            exit 0
          fi
          if [ ! -f "$f" ]; then
            echo "::error file=${f}::${f} is missing. It is the one home of where the build runs. Get it with copier update from blueprint v${first} or later."
            exit 1
          fi
          header="$(grep -m1 '^[[:space:]]*|' "$f" || true)"
          if [ -z "$header" ]; then
            echo "::error file=${f}::${f} has no table. Its header row must have the columns Environment, Address, Vercel project, Database, Moves on."
            exit 1
          fi
          missing=()
          for c in "Environment" "Address" "Vercel project" "Database" "Moves on"; do
            if ! awk -F'|' -v c="$c" '{ for (i = 1; i <= NF; i++) { g = $i; gsub(/^[ \t]+|[ \t]+$/, "", g); if (g == c) found = 1 } } END { exit !found }' <<<"$header"; then
              missing+=("$c")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            list="$(printf '%s, ' "${missing[@]}")"
            echo "::error file=${f}::The header row of the table in ${f} has no column ${list%, }."
            exit 1
          fi
          echo "${f}: the table has the five columns."

  workflows:
    name: check / workflows
    # A broken workflow fails silently until the day it is needed; actionlint catches it on the
    # change. It runs when a file under .github/workflows/ changed, also when `secrets` failed.
    needs: secrets
    if: ${{ !cancelled() && needs.secrets.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" actionlint
      - name: actionlint
        run: ./actionlint -color

  code:
    name: check / code
    # A build: lint, typecheck and test, each only if package.json defines it, so a freshly
    # rendered repo with no code yet is green. npm or pnpm, chosen by the lockfile.
    # A workspace: every stage contract keeps the ICM shape, as in the house.
    # Pull requests only: the deploy of main is the verdict there. A build skips it when every
    # changed file is under .icm/, .github/ or a markdown file. A workspace runs it when a
    # CONTEXT.md changed. Never required in a ruleset: see README.md, The ruleset.
    # A pull request that changes code also runs the repo's check:migrations, if package.json
    # defines it. The repo owns the check because the check knows its migration tool and its
    # folder; this workflow reads no migrations_path. Two checks are the repo's too
    # (2026-10-27): no format check, because formatting is never a verdict (README.md,
    # Principle 2), and a zero-warning lint limit goes in the repo's own lint script, because
    # the limit is a flag of the repo's linter.
    needs: secrets
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.secrets.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The migration-order check compares with the base branch, so it needs the history.
          fetch-depth: ${{ needs.secrets.outputs.has_check_migrations == 'true' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
      - name: Migration order
        # Before the install: a migration out of order is red in seconds. Runs when the repo
        # defines check:migrations and the pull request changes code.
        if: ${{ needs.secrets.outputs.code == 'true' && needs.secrets.outputs.has_check_migrations == 'true' }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm run --if-present check:migrations -- --base "origin/${GITHUB_BASE_REF}"
          else
            npm run --if-present check:migrations -- --base "origin/${GITHUB_BASE_REF}"
          fi
      - name: Install, lint, typecheck, test
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            run() { pnpm run --if-present "$1"; }
          else
            npm ci
            run() { npm run --if-present "$1"; }
          fi
          run lint
          run typecheck
          run test

  release-please:
    name: release / release-please
    # release-please opens and updates the release pull request on each push to main. The merge
    # of that pull request is the release: the tag, CHANGELOG.md and the GitHub release come
    # from it. Jamie says `release`, and the session merges it (.icm/scripts/release.sh).
    # Known limit: a pull request that GITHUB_TOKEN opens starts no workflow, so no check runs
    # on the release pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

# Label vocabulary for the delivery pipeline.
#
# Labels attach to the feature PR, projected ONE WAY from the run's spec.md (see
# pipeline/_shared/github.md). This file is documentation plus one-time repo setup: create any
# missing label once, via `gh label create` or the GitHub UI.
#
# Keep this list small and fixed — it powers at-a-glance observability, not free-form tagging.
# Gates are NOT labels: they are checkboxes in the PR body.

# --- Stage — exactly one, moving with the work along the spine -----------------------------------
- name: "stage:define"
  color: "c5def5"
  description: "Define — spec being agreed (draft PR)"
- name: "stage:build"
  color: "1d76db"
  description: "Build — implementation in progress on the run's branch"
- name: "stage:verify"
  color: "0e8a16"
  description: "Verify — quality gate: readiness/review/security + DoD smoke on the preview"
- name: "stage:ship"
  color: "5319e7"
  description: "Ship — docs + changelog → gated squash-merge → ship note"

# --- Type — spine features, the fast lanes, and the Design front's demo PRs -----------------------
- name: "type:feature"
  color: "a2eeef"
  description: "A spec'd feature run through the pipeline spine"
- name: "type:bug"
  color: "d73a4a"
  description: "Fast lane — reproduce → fix → verify; merge gate only"
- name: "type:tweak"
  color: "bfd4f2"
  description: "Fast lane — tiny, fully-specified adjustment; merge gate only"
- name: "type:chore"
  color: "cfd3d7"
  description: "Fast lane — refactor / dep bump / migration, no user-facing behaviour change"
- name: "type:design"
  color: "f9d0c4"
  description: "Design-front demo PR — apps/demo only, merges to the live demo URL"

# --- Complexity — mirrors the spec header, and sets Verify's code-review effort -------------------
- name: "complexity:trivial"
  color: "fef2c0"
  description: "Trivial — small, low-risk change (code review at low effort)"
- name: "complexity:standard"
  color: "fbca04"
  description: "Standard — typical feature scope (code review at medium effort)"
- name: "complexity:complex"
  color: "d93f0b"
  description: "Complex — large or high-risk change (code review at high effort)"

# --- App — which workspace the change lands in (zero or more) -------------------------------------
#
# This is the axis a persona vocabulary would occupy in a product with documented roles. Remi AI's
# roles aren't written yet (apps/docs/app/business/roles), so `app:` is used instead: it is
# verifiable from the diff today. Add a `persona:` axis alongside it once that page is real —
# project-labels.sh takes the new vocabulary in one place.
- name: "app:web"
  color: "ededed"
  description: "apps/web — the product"
- name: "app:admin"
  color: "ededed"
  description: "apps/admin — internal operations"
- name: "app:marketing"
  color: "ededed"
  description: "apps/marketing — the public site"
- name: "app:docs"
  color: "ededed"
  description: "apps/docs — the reference site"
- name: "app:support"
  color: "ededed"
  description: "apps/support — the public help centre"
- name: "app:demo"
  color: "ededed"
  description: "apps/demo — the prototype sandbox"
- name: "app:packages"
  color: "ededed"
  description: "packages/ui or packages/services — the shared layer"

# --- Intake — the issue front door, not a pipeline label ------------------------------------------
- name: "feedback"
  color: "d4c5f9"
  description: "Report or request awaiting triage into the pipeline"

packages:
  - apps/*
  - packages/*

# Shared runtime deps are pinned once, here. Apps and packages reference them as
# `catalog:` and never pin their own copy — see CONVENTIONS.md → "Keeping the codebase lean".
catalog:
  "@types/node": ^22
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vercel/analytics": ^1.5.0
  date-fns: ^4.1.0
  lucide-react: ^0.545.0
  motion: ^12.23.24
  next: ^16.2.3
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.1.14
  typescript: ^5.9.3
  vitest: ^3.2.4
  zod: ^4.3.0

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
